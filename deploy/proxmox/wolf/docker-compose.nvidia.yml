# NVIDIA override for Wolf on Proxmox / LXC2Docker.
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
#
# NVIDIA_VISIBLE_DEVICES (and the deploy reservation) make LXC2Docker inject the
# host NVIDIA driver into the Wolf CT via CDI — no manual driver volume. The
# same variables are propagated to the session CTs Wolf launches so they get the
# GPU too. Requires the NVIDIA driver loaded on the PVE host with nvidia-drm
# modeset=1.

services:
  wolf:
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
