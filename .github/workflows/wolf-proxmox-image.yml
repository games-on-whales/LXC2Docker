name: Wolf Proxmox image

# Builds and publishes the Proxmox Wolf image (upstream Wolf + Wolf Den UI) from
# deploy/proxmox/wolf/. Manual dispatch only — Wolf/Wolf-Den are heavy upstream
# images, so this doesn't run on every push.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 2026.07)"
        required: true
        default: latest
      wolf_base:
        description: "Upstream Wolf base image"
        required: true
        default: ghcr.io/games-on-whales/wolf:stable

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy/proxmox/wolf
          push: true
          build-args: |
            WOLF_BASE=${{ inputs.wolf_base }}
          tags: ghcr.io/${{ github.repository_owner }}/wolf-proxmox:${{ inputs.tag }}
