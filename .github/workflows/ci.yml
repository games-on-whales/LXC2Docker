name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblxc-dev

      - name: Install modules
        run: make deps

      - name: Run build
        run: |
          make test-build
          make build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblxc-dev

      - name: Install modules
        run: make deps

      - name: Run unit tests
        run: make test-unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblxc-dev

      - name: Install modules
        run: make deps

      - name: Run integration tests
        run: make test-integration

  package:
    name: Package (.deb)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, so `git describe` versions the .deb

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config liblxc-dev

      - name: Install modules
        run: make deps

      - name: Build .deb and tarball
        run: |
          make deb
          make tarball

      # Every build publishes downloadable artifacts so installing never needs
      # the build toolchain — the .deb (`apt install ./docker-lxc-daemon_*.deb`)
      # and a self-contained binary tarball.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-lxc-daemon-dist
          path: |
            bin/*.deb
            bin/*.tar.gz

      # On a v* tag, publish (or update) the GitHub release: generate notes from
      # the commit history and attach the .deb + tarball. `scripts/release.sh`
      # just pushes the tag; this step does the rest.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.deb
            bin/*.tar.gz
          generate_release_notes: true
